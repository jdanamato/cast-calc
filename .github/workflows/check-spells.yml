# Weekly check that Cast Calc's spell data still matches the OSRS Wiki.
#
# Runs scripts/check_spells.py (plain Python calling the wiki's public API;
# no AI, no secrets). If anything differs, it opens a GitHub issue with the
# report, or updates the open one. When everything matches again, it closes
# that issue. Run it by hand from the Actions tab with "Run workflow".
name: Check spell data

on:
  schedule:
    # Thursdays 14:00 UTC: the day after OSRS's usual Wednesday game update,
    # so the wiki has had time to document new spells.
    - cron: "0 14 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Spell data differs from the OSRS Wiki
    steps:
      - uses: actions/checkout@v4

      - name: Compare with the OSRS Wiki
        id: check
        run: |
          set +e
          python3 scripts/check_spells.py > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Find an open issue from an earlier run
        id: issue
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          echo "number=$num" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.check.outputs.status == '1'
        run: |
          {
            cat report.md
            echo
            echo "_Found by the weekly [spell check](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > body.md
          if [ -n "${{ steps.issue.outputs.number }}" ]; then
            gh issue edit "${{ steps.issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Close the issue once everything matches
        if: steps.check.outputs.status == '0' && steps.issue.outputs.number != ''
        run: |
          gh issue close "${{ steps.issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --comment "All spells match the wiki again."

      - name: Fail the run if the wiki couldn't be read
        if: steps.check.outputs.status == '2'
        run: |
          echo "::error::The spell check couldn't read the OSRS Wiki (network error or format change). See the log above."
          exit 1
